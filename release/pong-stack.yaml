AWSTemplateFormatVersion: '2010-09-09'
Description: 'DICT_PONG - upload ZIP to S3, then create this stack. No Git or local CLI required.'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: '1. ZIP uploaded to S3'}
        Parameters: [ArtifactBucket, ArtifactKey]
      - Label: {default: '2. Server size (default recommended)'}
        Parameters: [InstanceType, DataVolumeSize, CpuCredits]
      - Label: {default: '3. Cost control and logs'}
        Parameters: [EnableNightSchedule, LogRetentionDays]
      - Label: {default: '4. Optional audit history'}
        Parameters: [EnableAuditTrail]
Parameters:
  ArtifactBucket:
    Type: String
    Description: 'Existing PRIVATE S3 bucket name containing pong-app.zip (same AWS region).'
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  ArtifactKey:
    Type: String
    Default: pong-app.zip
    Description: 'S3 object key, not an s3:// URL. Use letters, digits, slash, dot, underscore, hyphen.'
    AllowedPattern: '[a-zA-Z0-9_./-]+'
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
  DataVolumeSize:
    Type: Number
    Default: 8
    MinValue: 8
    MaxValue: 100
    Description: 'Persistent encrypted data disk in GiB. Retained if stack is deleted.'
  CpuCredits:
    Type: String
    Default: standard
    AllowedValues: [standard, unlimited]
    Description: 'standard avoids surplus CPU credit charges; CPU slows when credits run out.'
  EnableNightSchedule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'Stop at 00:00 and start at 08:00 Asia/Tokyo. Start-up takes a few minutes.'
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: 'CloudWatch log retention. Default 7 days to limit storage costs.'
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  EnableAuditTrail:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'Create a single-region management-events CloudTrail and 30-day S3 storage. Check existing trails first to avoid paid duplicate copies.'
Conditions:
  NightScheduleEnabled: !Equals [!Ref EnableNightSchedule, 'true']
  AuditTrailEnabled: !Equals [!Ref EnableAuditTrail, 'true']
Resources:
  AuditBucket:
    Type: AWS::S3::Bucket
    Condition: AuditTrailEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAuditAfter30Days
            Status: Enabled
            ExpirationInDays: 30
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: AuditTrailEnabled
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit'
          - Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AuditBucket.Arn, !Sub '${AuditBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: AuditTrailEnabled
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub '${AWS::StackName}-audit'
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      S3BucketName: !Ref AuditBucket
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
          ExcludeManagementEventSources: [kms.amazonaws.com, rdsdata.amazonaws.com]
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/pong/${AWS::StackName}/application'
      RetentionInDays: !Ref LogRetentionDays
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.48.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-vpc'}]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref Gateway}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.48.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  Route:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Gateway}
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable}
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'PONG HTTP origin. Application also requires a CloudFront-generated origin header. No SSH.'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0}
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'Automatic CloudFront-to-PONG origin header. Not a player/admin password.'
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: PongArtifactsAndBackups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactKey}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/backups/${AWS::StackName}/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/backups/${AWS::StackName}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OriginSecret
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt ApplicationLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
  ServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref ServerRole]}
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-PERSISTENT-DATA'}]
  ServerWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
  GameServer:
    Type: AWS::EC2::Instance
    DependsOn: [Route, RouteAssociation]
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      CreditSpecification: {CPUCredits: !Ref CpuCredits}
      IamInstanceProfile: !Ref ServerProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref ServerSecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 12, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-server'}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export AWS_DEFAULT_REGION='${AWS::Region}'
          export PONG_STACK='${AWS::StackName}'
          export PONG_ASSET_BUCKET='${ArtifactBucket}'
          export PONG_ASSET_KEY='${ArtifactKey}'
          export PONG_DATA_VOLUME='${DataVolume}'
          export PONG_ORIGIN_SECRET='${OriginSecret}'
          export PONG_WAIT_HANDLE='${ServerWaitHandle}'
          export PONG_LOG_GROUP='${ApplicationLogGroup}'
          dnf install -y aws-cfn-bootstrap
          trap 'rc=$?; /opt/aws/bin/cfn-signal -e "$rc" "$PONG_WAIT_HANDLE"' EXIT
          dnf install -y unzip nginx python3 awscli-2 tar xz
          mkdir -p /opt/pong
          aws s3 cp "s3://$PONG_ASSET_BUCKET/$PONG_ASSET_KEY" /tmp/pong-app.zip --only-show-errors
          unzip -q /tmp/pong-app.zip -d /opt/pong
          bash /opt/pong/aws/bootstrap.sh
  ElasticAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc, InstanceId: !Ref GameServer}
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref GameServer, VolumeId: !Ref DataVolume}
  ServerReady:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: DataAttachment
    Properties: {Handle: !Ref ServerWaitHandle, Timeout: '1200', Count: 1}
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: [ServerReady, ElasticAddress]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} DICT_PONG'
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: pong-server
            DomainName: !GetAtt GameServer.PublicDnsName
            OriginCustomHeaders:
              - HeaderName: X-Pong-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}:SecretString}}'
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: pong-server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 413f160d-7c0c-4f7b-9fda-1441f4af0a9c
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          Compress: true
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
  UpdateApplicationDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: 'Update PONG from the same S3 ZIP object. Creates a backup and keeps the previous code for rollback.'
        mainSteps:
          - action: aws:runShellScript
            name: UpdatePong
            inputs:
              timeoutSeconds: '600'
              runCommand:
                - !Sub "export PONG_LOG_GROUP='${ApplicationLogGroup}'"
                - 'bash /opt/pong/aws/update.sh'
  ConfigureMonitoringDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content:
        schemaVersion: '2.2'
        description: 'Configure CloudWatch collection after updating the application ZIP. Restarts PONG.'
        mainSteps:
          - action: aws:runShellScript
            name: ConfigureMonitoring
            inputs:
              timeoutSeconds: '600'
              runCommand:
                - !Sub "export PONG_LOG_GROUP='${ApplicationLogGroup}'"
                - 'bash /opt/pong/aws/configure-monitoring.sh'
  NightScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals:
                aws:SourceArn: !GetAtt NightScheduleGroup.Arn
      Policies:
        - PolicyName: StartStopOnlyThisServer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${GameServer}'
  StopAtMidnight:
    Type: AWS::Scheduler::Schedule
    DependsOn: ServerReady
    Properties:
      GroupName: !Ref NightScheduleGroup
      Description: 'Stop PONG daily at midnight Japan time.'
      ScheduleExpression: 'cron(0 0 * * ? *)'
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: !If [NightScheduleEnabled, ENABLED, DISABLED]
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:ec2:stopInstances'
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: !Sub '{"InstanceIds":["${GameServer}"]}'
        RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 2}
  StartAtEight:
    Type: AWS::Scheduler::Schedule
    DependsOn: ServerReady
    Properties:
      GroupName: !Ref NightScheduleGroup
      Description: 'Start PONG daily at 08:00 Japan time (allow a few minutes to boot).'
      ScheduleExpression: 'cron(0 8 * * ? *)'
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: !If [NightScheduleEnabled, ENABLED, DISABLED]
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:ec2:startInstances'
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: !Sub '{"InstanceIds":["${GameServer}"]}'
        RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 2}
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-operations'
      DashboardBody: !Sub |
        {"start":"-PT3H","periodOverride":"inherit","widgets":[
          {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"# PONG operations\nJapan time: OFF 00:00-08:00 (when enabled). Usage logs arrive every 60 seconds while running. Select a short time range; log queries are billed by data scanned. No custom metrics."}},
          {"type":"metric","x":0,"y":2,"width":12,"height":6,"properties":{"title":"CPU and remaining CPU credits","region":"${AWS::Region}","period":300,"stat":"Average","metrics":[["AWS/EC2","CPUUtilization","InstanceId","${GameServer}"],["AWS/EC2","CPUCreditBalance","InstanceId","${GameServer}",{"yAxis":"right"}]]}},
          {"type":"metric","x":12,"y":2,"width":12,"height":6,"properties":{"title":"Network traffic (bytes / 5 min)","region":"${AWS::Region}","period":300,"stat":"Sum","metrics":[["AWS/EC2","NetworkIn","InstanceId","${GameServer}"],["AWS/EC2","NetworkOut","InstanceId","${GameServer}"]]}},
          {"type":"log","x":0,"y":8,"width":12,"height":6,"properties":{"title":"Online players / active matches","region":"${AWS::Region}","view":"timeSeries","query":"SOURCE '${ApplicationLogGroup}' | filter event = 'usage' | stats max(online) as OnlinePlayers, max(matches) as ActiveMatches, max(waiting) as Waiting by bin(5m)"}},
          {"type":"log","x":12,"y":8,"width":12,"height":6,"properties":{"title":"Finished / interrupted matches by mode","region":"${AWS::Region}","view":"table","query":"SOURCE '${ApplicationLogGroup}' | filter event = 'match_finished' | stats count(*) as Matches, avg(durationSeconds) as AvgSeconds by mode, outcome, reason"}},
          {"type":"log","x":0,"y":14,"width":12,"height":6,"properties":{"title":"Recent usage and memory (MB)","region":"${AWS::Region}","view":"table","query":"SOURCE '${ApplicationLogGroup}' | filter event = 'usage' | fields @timestamp, online, playing, matches, waiting, memoryMb | sort @timestamp desc | limit 30"}},
          {"type":"log","x":12,"y":14,"width":12,"height":6,"properties":{"title":"Application / nginx errors","region":"${AWS::Region}","view":"table","query":"SOURCE '${ApplicationLogGroup}' | filter event = 'request_error' or @logStream like /nginx/ | fields @timestamp, @logStream, @message | sort @timestamp desc | limit 50"}}
        ]}
Outputs:
  AuditLogBucket:
    Condition: AuditTrailEnabled
    Description: 'CloudTrail management events in this region plus global service events; retained bucket, 30-day expiry.'
    Value: !Ref AuditBucket
  GameURL:
    Description: 'Open this HTTPS URL and share it with players.'
    Value: !Sub 'https://${Distribution.DomainName}'
  ServerInstanceId:
    Description: 'EC2 instance. Manage with Session Manager; no SSH key required.'
    Value: !Ref GameServer
  PersistentDataVolume:
    Description: 'Retained encrypted EBS data volume. Keep its ID for recovery/deletion.'
    Value: !Ref DataVolume
  BackupLocation:
    Description: 'Hourly SQLite backups. Download via the S3 console.'
    Value: !Sub 's3://${ArtifactBucket}/backups/${AWS::StackName}/'
  DistributionId:
    Description: 'CloudFront distribution ID.'
    Value: !Ref Distribution
  UpdateCommandDocument:
    Description: 'In Systems Manager > Run Command, select this document to install an overwritten S3 ZIP.'
    Value: !Ref UpdateApplicationDocument
  MonitoringCommandDocument:
    Description: 'SSM Run Command document to install/repair CloudWatch collection.'
    Value: !Ref ConfigureMonitoringDocument
  ApplicationLogs:
    Description: 'CloudWatch Logs group: usage, matches and errors. Default 7-day retention.'
    Value: !Ref ApplicationLogGroup
  DashboardURL:
    Description: 'Open the CloudWatch usage and server dashboard.'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OperationsDashboard}'
  ScheduleGroup:
    Description: 'EventBridge Scheduler group. OFF 00:00-08:00 Asia/Tokyo by default.'
    Value: !Ref NightScheduleGroup
